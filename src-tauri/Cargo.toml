[package]
name = "ai-desk"
version = "0.1.0"
description = "A local desktop UI for pi-coding-agent"
authors = ["pine-storm"]
edition = "2021"

[lib]
name = "ai_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.4.2"
thiserror = "2"
